[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nerve-awim"
description = "NERVE-AWIM research package. Experimental simulated models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
auth = ["PyJWT[crypto]>=2.10,<3"]
mcp = ["mcp==2.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "nerve_awim.__version__" }
