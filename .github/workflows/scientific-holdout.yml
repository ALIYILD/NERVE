name: scientific-holdout-fixtures
on:
  push:
    paths:
      - 'src/nerve_awim/memory_gateway/scientific*holdout*.py'
      - 'src/nerve_awim/memory_gateway/scientific_retry_transport.py'
      - 'tests/test_scientific*holdout.py'
      - '.github/workflows/scientific-holdout.yml'
  pull_request:
    paths:
      - 'src/nerve_awim/memory_gateway/scientific*holdout*.py'
      - 'src/nerve_awim/memory_gateway/scientific_retry_transport.py'
      - 'tests/test_scientific*holdout.py'
      - '.github/workflows/scientific-holdout.yml'
permissions:
  contents: read
jobs:
  mocked-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyJWT[crypto]>=2.10,<3' 'jsonschema>=4.23,<5'
      - name: Synthetic fixtures only; no real bank or model calls
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_scientific*holdout.py'
