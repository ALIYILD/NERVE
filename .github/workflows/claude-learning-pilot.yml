name: claude-learning-pilot
on:
  push:
    branches: [main]
    paths: ['research/claude-pilot-launch.txt']
permissions:
  contents: read
concurrency:
  group: claude-learning-pilot-20261011
  cancel-in-progress: false
jobs:
  pilot:
    # Non-generating diagnosis only; no paid message call.
    if: github.run_attempt == 1 && github.event.head_commit.message == 'check Claude credential format 20261011-e92c4'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check credential without generation
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.claude_git }}
          PILOT_PRIOR_RESERVED_MICROUSD: '9046080'
        run: python scripts/claude_key_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-pilot-report
          path: |
            claude-pilot-report.json
            claude-pilot-budget.sqlite
