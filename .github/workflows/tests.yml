name: research-smoke-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OIDC crypto test dependencies
        run: python -m pip install 'PyJWT[crypto]>=2.10,<3'
      - env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify research checkpoint provenance discovery
        run: node --test tests/test_checkpoint_discovery.cjs
      - name: Verify offline cognitive cue commissioning and fail-closed activation
        env:
          PYTHONPATH: src
        run: python -m nerve_awim.cue_cli demo --output /tmp/nerve-cce-demo.json
      - name: Run chronological adaptive-memory capable-control study
        env:
          PYTHONPATH: src
        run: python scripts/adaptive_memory_study.py
      - name: Run offline multi-family learning and retention checks
        env:
          PYTHONPATH: src
        run: python scripts/offline_learning_suite.py
      - name: Run reproducible v1.3 benchmark
        env:
          PYTHONPATH: src
        run: python benchmarks/v13_benchmark.py

      - name: Compare uncertainty-gated and ungated controllers
        env:
          PYTHONPATH: src
        run: python benchmarks/v16_benchmark.py

      - name: Benchmark risk-aware action selection
        env:
          PYTHONPATH: src
        run: python benchmarks/v17_benchmark.py

      - name: Benchmark sensor outages and interval coverage
        env:
          PYTHONPATH: src
        run: python benchmarks/v18_benchmark.py

      - name: Benchmark adaptive uncertainty coverage
        env:
          PYTHONPATH: src
        run: python benchmarks/v19_benchmark.py

      - name: Benchmark v2.0 sensor-failure response
        env:
          PYTHONPATH: src
        run: python benchmarks/v20_benchmark.py

      - name: Benchmark supervised sensor recovery
        env:
          PYTHONPATH: src
        run: python benchmarks/v21_benchmark.py

      - name: Benchmark v3.0 agent routing and provenance
        env:
          PYTHONPATH: src
        run: python benchmarks/v30_benchmark.py

      - name: Benchmark v3.1 contextual collaboration
        env:
          PYTHONPATH: src
        run: python benchmarks/v31_benchmark.py

      - name: Run matched-feedback v3.1 ablation
        env:
          PYTHONPATH: src
        run: python benchmarks/v31_ablation.py

      - name: Benchmark complementary sensor ablation
        env:
          PYTHONPATH: src
        run: python benchmarks/v32_multimodal.py

      - name: Benchmark nonlinear specialist and unified learners
        env:
          PYTHONPATH: src
        run: python benchmarks/v33_nonlinear.py

      - name: Run bounded AutoResearch experiments
        env:
          PYTHONPATH: src
        run: python -m nerve_awim.autoresearch_v01

      - name: Run bounded AutoResearch v0.2 coordinator
        env:
          PYTHONPATH: src
        run: python -m nerve_awim.autoresearch_v02

      - name: Run cross-benchmark AutoResearch v0.3 gate
        env:
          PYTHONPATH: src
        run: python -m nerve_awim.autoresearch_v03

      - name: Run AutoResearch v0.4 WorldCore closed-loop gate
        env:
          PYTHONPATH: src
        run: python -m nerve_awim.autoresearch_v04

      - name: Check AutoResearch v0.5 absolute eligibility
        env:
          PYTHONPATH: src
        run: python -m nerve_awim.autoresearch_v05

      - name: Evaluate simulated recovery research v0.6
        env:
          PYTHONPATH: src
        run: python benchmarks/v06_recovery_research.py

      - name: Verify AutoResearch v0.8 aggregate review
        env:
          PYTHONPATH: src
        run: python -m nerve_awim.autoresearch_v08

      - name: Evaluate gated v0.9 outage search
        env:
          PYTHONPATH: src
        run: python -m nerve_awim.autoresearch_v09

      - name: Test outcome-aware Evolution Engine
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_evolution_v01.py' -v

      - name: Benchmark parallel Evolution specialist agents
        env:
          PYTHONPATH: src
        run: python benchmarks/v11_parallel_evolution.py

      - name: Benchmark experiential memory against recency
        env:
          PYTHONPATH: src
        run: python benchmarks/v11_memory_effectiveness.py

      - name: Compare advisory Jev judgments with deterministic acceptance
        env:
          PYTHONPATH: src
        run: python -m nerve_awim.jev_agreement_v12

      - name: Benchmark executable agent strategy learning v1.2
        env:
          PYTHONPATH: src
        run: python benchmarks/v12_executable_agents.py

      - name: Benchmark v1.3 MCP-ready two-stage agent strategy adaptation
        env:
          PYTHONPATH: src
        run: python benchmarks/v13_external_mcp.py

      - name: Install official MCP SDK for real stdio interoperability test
        run: python -m pip install 'mcp==2.3.0'
      - name: Verify external SDK tool discovery and two-stage agent execution
        env:
          PYTHONPATH: src
        run: python scripts/mcp_wire_v13.py

      - name: Compare fixed-planner MCP agent with and without NERVE memory
        env:
          PYTHONPATH: src
        run: python scripts/llm_mcp_v14.py --cases 4

      - name: Test live-shaped model API adapter through real MCP transport (mocked)
        env:
          PYTHONPATH: src
        run: python scripts/llm_mcp_v14.py --mock-api --cases 4

      - name: V1.5 paired capable-agent control (same result with and without memory)
        env:
          PYTHONPATH: src
        run: python scripts/agent_study_v15.py --seeds 2 --cases 3
      - name: V1.5 paired limited-agent learning demonstration
        env:
          PYTHONPATH: src
        run: python scripts/agent_study_v15.py --limited-fixture --seeds 2 --cases 3
      - name: V1.5 model HTTP contract through real MCP stdio (mocked)
        env:
          PYTHONPATH: src
        run: python scripts/agent_study_v15.py --mock-api --seeds 2 --cases 3

      - name: V1.6 seed-cluster paired assessment with a capable planner
        env:
          PYTHONPATH: src
        run: python scripts/agent_study_v15.py --seeds 5 --cases 2
      - name: V1.6 provider-failure accounting with equal task denominators
        env:
          PYTHONPATH: src
        run: python scripts/agent_study_v15.py --failure-fixture --seeds 2 --cases 2

      - name: Benchmark bounded agent retry and outcome memory v1.7
        env:
          PYTHONPATH: src
        run: python benchmarks/v17_recovery_agents.py

      - name: Benchmark v1.8 lexical memory vs sandboxed Mem0-shaped ranking
        env:
          PYTHONPATH: src
        run: python benchmarks/v18_memory_retrieval.py

      - name: Verify bounded AlphaEvolve-inspired recursive research loop
        env:
          PYTHONPATH: src
        run: python -m nerve_awim.recursive_evolution_v19

      - name: Verify independent WorldCore generational selection
        env:
          PYTHONPATH: src
        run: python -m nerve_awim.worldcore_recursion_v19

      - name: Verify governed outcome learning and reversible repository-agent release
        env:
          PYTHONPATH: src
        run: python benchmarks/v20_governed_repository_learning.py

      - name: Verify real-file shadow collection across processes without activation
        env:
          PYTHONPATH: src
        run: python scripts/verify_shadow_v21.py

      - name: Verify sealed repository pilot and persisted rollout recommendation
        env:
          PYTHONPATH: src
        run: python scripts/verify_repository_pilot_v22.py

      - name: Verify bounded canary traffic and automatic baseline fallback
        env:
          PYTHONPATH: src
        run: python scripts/verify_canary_v23.py

      - name: Verify opt-in declarative world-model recovery and authority boundaries
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/world_model -v

      - name: Run scripted offline world-model demo
        env:
          PYTHONPATH: src
        run: python -m nerve_awim.world_model.cli --db /tmp/nerve-world-model-ci.sqlite3 demo --json

      - name: Record world-model generalization and ablation limitations
        env:
          PYTHONPATH: src
        run: python benchmarks/world_model/benchmark.py

      - name: Verify persistent uncertainty and scoped dispatch boundaries
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_uncertainty*.py' -v

      - name: Inspect offline uncertainty configuration without provider calls
        env:
          PYTHONPATH: src
        run: python -m nerve_awim.uncertainty.cli doctor --json

      - name: Exercise combined ARC adaptation uncertainty and world-model recovery
        env:
          PYTHONPATH: src
        run: python -m nerve_awim.uncertainty.combined_demo --state /tmp/nerve-combined-ci.sqlite3

      - name: Verify NERVE world-model entry point
        run: python scripts/nerve_world_model.py doctor --json

      - name: Smoke test learned frame rules and repository tool wiring
        env:
          PYTHONPATH: src
        run: |
          python -m nerve_awim world-model study --directory /tmp/nerve-world-model-frame-ci --final-per-family 2 --final-seed 19003
          python -m nerve_awim world-model repository-study --repository . --directory /tmp/nerve-world-model-repository-ci

  adaptation-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional CPU research dependencies
        run: python -m pip install 'numpy==2.2.6' 'PyJWT[crypto]>=2.10,<3'
      - name: Verify adaptation and optional memory derivatives
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_adaptation*.py' -v
      - name: Train bounded synthetic external memory
        env:
          PYTHONPATH: src
        run: >-
          python scripts/agentos_bridge.py research-fast-memory-train --synthetic
          --config configs/adaptation/research-config.json
          --budget configs/adaptation/research-budget.json
          --state /tmp/nerve-adaptation-research
          --report /tmp/nerve-adaptation-memory.json
      - name: Evaluate matched context scaling without promotion
        env:
          PYTHONPATH: src
        run: >-
          python scripts/agentos_bridge.py research-fast-memory-evaluate --synthetic
          --checkpoint /tmp/nerve-adaptation-memory.json
          --suite configs/adaptation/research-suite.json
          --budget configs/adaptation/research-budget.json
          --state /tmp/nerve-adaptation-research
          --report /tmp/nerve-adaptation-scaling.json
