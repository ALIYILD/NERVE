name: research-smoke-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run reproducible v1.3 benchmark
        env:
          PYTHONPATH: src
        run: python benchmarks/v13_benchmark.py

      - name: Compare uncertainty-gated and ungated controllers
        env:
          PYTHONPATH: src
        run: python benchmarks/v16_benchmark.py
